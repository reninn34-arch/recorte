<style>
  #p-cta { position: absolute; left: 50%; top: 70%; display: flex; flex-direction: column; align-items: center; }
  #p-boton { position: relative; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 7.6vmin; color: var(--colorTexto); background: var(--color);
    padding: 2.4vmin 6vmin; border-radius: 99vmin; white-space: nowrap; box-shadow: 0 1.2vmin 0 rgba(0,0,0,.22), 0 2vmin 4vmin rgba(0,0,0,.25); }
  #p-onda { position: absolute; inset: 0; border-radius: 99vmin; border: .8vmin solid var(--color); opacity: 0; }
  #p-sub { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 4.6vmin; color: #ffffff; margin-top: 2.6vmin; padding: 1vmin 2.6vmin;
    border-radius: 99vmin; background: rgba(0,0,0,.45); white-space: nowrap; opacity: 0; }
  #p-mano { position: absolute; right: -3vmin; bottom: -8vmin; width: 13vmin; height: 13vmin; opacity: 0; }
  #p-mano svg { width: 100%; height: 100%; filter: drop-shadow(0 .8vmin 1.2vmin rgba(0,0,0,.35)); }
</style>
<div id="p-cta">
  <div id="p-boton"><span data-var-text="texto"></span><div id="p-onda"></div></div>
  <div id="p-sub" data-var-text="subtexto"></div>
  <div id="p-mano">
    <svg viewBox="0 0 64 64"><path d="M24 6c3 0 5 2 5 5v17l2-1c3-1 6 0 7 2l1 1 2-1c3-1 6 0 7 3 2-1 6 0 7 3l2 10c1 6-2 12-8 14l-7 2c-6 1-12-1-15-6l-9-14c-2-2-1-5 1-6 2-2 5-1 7 1l1 2V11c0-3 2-5 5-5z" fill="#ffffff" stroke="#1d1d1f" stroke-width="2.5" stroke-linejoin="round"/></svg>
  </div>
</div>
<script>
  // Llamado a la acción: el botón aparece con rebote, una mano entra y lo toca (el botón se hunde y suelta una onda),
  // la línea de abajo sube, y el botón late hasta el final.
  if (!v.subtexto) document.getElementById('p-sub').style.display = 'none'
  const vmin = Math.min(W, H) / 100
  tl.set('#p-cta', { xPercent: -50, yPercent: -50 }, 0)
  tl.fromTo('#p-boton', { scale: 0, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.55, ease: 'back.out(2.4)' }, 0.05)
  tl.fromTo('#p-mano', { x: 14 * vmin, y: 14 * vmin, opacity: 0, rotation: -15 }, { x: 0, y: 0, opacity: 1, rotation: 0, duration: 0.45, ease: 'power3.out' }, 0.45)
  tl.to('#p-mano', { scale: 0.86, duration: 0.1, ease: 'power2.in' }, 0.95)
  tl.to('#p-boton', { scale: 0.92, duration: 0.1, ease: 'power2.in' }, 0.95)
  tl.to('#p-mano', { scale: 1, duration: 0.2, ease: 'back.out(3)' }, 1.05)
  tl.to('#p-boton', { scale: 1, duration: 0.3, ease: 'back.out(3)' }, 1.05)
  tl.fromTo('#p-onda', { scale: 1, opacity: 0.9 }, { immediateRender: false, scale: 1.5, opacity: 0, duration: 0.6, ease: 'power2.out' }, 1.05)
  if (v.subtexto) tl.fromTo('#p-sub', { y: 2 * vmin, opacity: 0 }, { immediateRender: false, y: 0, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 1.1)
  tl.to('#p-mano', { x: 10 * vmin, y: 12 * vmin, opacity: 0, duration: 0.4, ease: 'power2.in' }, 1.5)
  // Late cada 0,8 s y se va al final.
  for (let t = 1.9; t < DUR - 0.8; t += 0.8) {
    tl.to('#p-boton', { scale: 1.07, duration: 0.18, ease: 'power2.out' }, t)
    tl.to('#p-boton', { scale: 1, duration: 0.3, ease: 'power2.inOut' }, t + 0.18)
  }
  tl.to('#p-cta', { scale: 0.5, opacity: 0, duration: 0.3, ease: 'back.in(2)' }, DUR - 0.3)
</script>
