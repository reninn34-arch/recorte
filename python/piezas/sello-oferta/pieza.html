<style>
  #p-sello { position: absolute; left: calc(100% - 30vmin); top: calc(9% + 22vmin); width: 44vmin; height: 44vmin; margin: -22vmin 0 0 -22vmin; }
  #p-estrella { position: absolute; inset: 0; }
  #p-estrella svg { width: 100%; height: 100%; filter: drop-shadow(0 1.6vmin 2.6vmin rgba(0,0,0,.35)); }
  #p-centro { position: absolute; inset: 14%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-8deg); }
  #p-texto { font-family: 'Archivo Black', 'Montserrat', sans-serif; font-weight: 900; font-size: 9vmin; line-height: .95; color: var(--colorTexto); text-transform: uppercase; }
  #p-sub { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 4.6vmin; line-height: 1; color: var(--colorTexto); margin-top: 1vmin; }
  #p-polvo i { position: absolute; left: 50%; top: 50%; width: 3vmin; height: 3vmin; margin: -1.5vmin 0 0 -1.5vmin; border-radius: 50%; background: rgba(255,255,255,.75); opacity: 0; }
</style>
<div id="p-sello">
  <div id="p-polvo"></div>
  <div id="p-estrella"><svg viewBox="0 0 100 100"><polygon id="p-forma" fill="var(--color)" stroke="#ffffff" stroke-width="2.4" /></svg></div>
  <div id="p-centro"><div id="p-texto" data-var-text="texto"></div><div id="p-sub" data-var-text="subtexto"></div></div>
</div>
<script>
  // Sello de oferta: un sello en forma de estrella cae desde la cámara, golpea (todo tiembla y salta polvo) y queda
  // girando despacio. Para un precio, un descuento o «¡Nuevo!».
  if (!v.subtexto) document.getElementById('p-sub').style.display = 'none'
  const vmin = Math.min(W, H) / 100
  const puntas = 16
  const pts = []
  for (let i = 0; i < puntas * 2; i++) {
    const r = i % 2 ? 41 : 49
    const a = (i / (puntas * 2)) * Math.PI * 2
    pts.push(`${(50 + Math.cos(a) * r).toFixed(2)},${(50 + Math.sin(a) * r).toFixed(2)}`)
  }
  document.getElementById('p-forma').setAttribute('points', pts.join(' '))
  const largo = String(v.texto || '').length
  document.getElementById('p-texto').style.fontSize = Math.min(11, 60 / Math.max(4, largo)) + 'vmin'
  tl.fromTo('#p-sello', { scale: 3.2, opacity: 0, rotation: 25 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.32, ease: 'power4.in' }, 0.05)
  tl.to('#p-sello', { keyframes: { x: [0, -1.2 * vmin, 1 * vmin, -0.6 * vmin, 0], y: [0, 0.8 * vmin, -0.6 * vmin, 0.3 * vmin, 0] }, duration: 0.25, ease: 'none' }, 0.37)
  const polvo = document.getElementById('p-polvo')
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('i')
    polvo.appendChild(p)
    const a = (i / 12) * Math.PI * 2
    tl.fromTo(p, { x: 0, y: 0, scale: 1, opacity: 0.9 }, { immediateRender: false, x: Math.cos(a) * 36 * vmin, y: Math.sin(a) * 36 * vmin, scale: 2.4, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.37)
  }
  tl.to('#p-estrella', { rotation: 25, duration: Math.max(0.5, DUR - 0.4), ease: 'none' }, 0.4)
  tl.to('#p-sello', { scale: 0, opacity: 0, duration: 0.3, ease: 'back.in(2)' }, DUR - 0.3)
</script>
