# Publica una versión: al subir una etiqueta vX.Y.Z (npm version patch && git push --follow-tags)
# compila el instalador de Windows y lo sube a GitHub Releases con latest.yml, que es lo
# que mira la app instalada para avisar de la actualización.
name: Publicar versión

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
