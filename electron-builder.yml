appId: com.recorte.app
productName: Recorte
copyright: Copyright © 2026 reninn34-arch. Todos los derechos reservados.

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: python
    to: python

win:
  target:
    - nsis
  # Nombre fijo: el botón del README baja siempre la última (releases/latest/download/…).
  artifactName: ${productName}-Setup.${ext}

# Mac: un .dmg para Apple Silicon (M1 y siguientes) y otro para Intel. Sin firma de Apple (hace falta una cuenta de
# desarrollador): la primera vez se abre con clic derecho → Abrir. Por eso la app no se actualiza sola en Mac:
# avisa de la versión nueva y manda a la página de versiones (ver main/actualizar.ts).
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-Mac-${arch}.${ext}
  # Sin certificado: se firma "ad hoc" (hace falta en Apple Silicon para que la app arranque).
  identity: null

dmg:
  title: Recorte ${version}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Recorte
  language: "1034"
  # El instalador muestra la licencia y pide aceptarla.
  # Copia con marca UTF-8 (la genera scripts/licencia-instalador.mjs; sin ella salen mal las tildes).
  license: build/licencia-instalador.txt

# Las versiones se publican en GitHub Releases; la app instalada las busca ahí
# (electron-updater) y avisa al usuario. Ver docs/ARQUITECTURA.md → «Publicar una versión».
publish:
  provider: github
  owner: reninn34-arch
  repo: recorte
  releaseType: release
  # Lo sube el workflow con `gh release create` (ver .github/workflows/release.yml).
