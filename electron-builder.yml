appId: com.recorte.app
productName: Recorte
copyright: Copyright © 2026 reninn34-arch. Todos los derechos reservados.

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: python
    to: python

win:
  target:
    - nsis
  # Nombre fijo: el botón del README baja siempre la última (releases/latest/download/…).
  artifactName: ${productName}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Recorte
  language: "1034"
  # El instalador muestra la licencia y pide aceptarla.
  license: LICENSE

# Las versiones se publican en GitHub Releases; la app instalada las busca ahí
# (electron-updater) y avisa al usuario. Ver docs/ARQUITECTURA.md → «Publicar una versión».
publish:
  provider: github
  owner: reninn34-arch
  repo: recorte
  releaseType: release
  # Lo sube el workflow con `gh release create` (ver .github/workflows/release.yml).
