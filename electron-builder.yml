appId: com.recorte.app
productName: Recorte
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: python
    to: python

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Recorte
  language: "1034"

# Las versiones se publican en GitHub Releases; la app instalada las busca ahí
# (electron-updater) y avisa al usuario. Ver docs/ARQUITECTURA.md → «Publicar una versión».
publish:
  provider: github
  owner: reninn34-arch
  repo: recorte
  releaseType: release
